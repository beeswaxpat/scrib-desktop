name: Release

on:
  push:
    tags: ['v*']

# Least privilege at workflow scope. Write access used to be granted here for
# the whole workflow, so every step (including third-party action code) ran
# with a token that could push commits, move tags and publish releases. Only
# the publish job below is granted write access now.
permissions:
  contents: read

jobs:
  build:
    name: Build and attest Windows release
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
      # Required by actions/attest-build-provenance: id-token for the Sigstore
      # OIDC exchange, attestations to record the signed statement on the repo.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          # Pinned so every release builds against one Flutter version (the
          # MSVC toolchain under windows-latest still floats, so this is a
          # pinned SDK rather than a reproducible build). A floating `stable`
          # breaks the Windows build whenever a new Flutter framework release
          # adds abstract members the pinned flutter_quill version doesn't yet
          # implement. Bump this in lockstep with the flutter_quill dependency.
          flutter-version: 3.38.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      # Authenticode signing is skipped until a certificate exists, so this
      # workflow keeps publishing exactly as it does today. To turn it on, the
      # maintainer creates an Azure Trusted Signing account and sets these
      # repository secrets:
      #   AZURE_TRUSTED_SIGNING_ACCOUNT   account name (its presence is the switch)
      #   AZURE_TRUSTED_SIGNING_PROFILE   certificate profile name
      #   AZURE_TRUSTED_SIGNING_ENDPOINT  e.g. https://eus.codesigning.azure.net
      #   AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET (service principal)
      # The `secrets` context is not available in a step-level `if`, so the
      # presence check is resolved into a step output first.
      - name: Check for signing credentials
        id: signing
        shell: pwsh
        env:
          SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_ACCOUNT)) {
            "configured=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "::notice::No code-signing certificate is configured; publishing an unsigned build."
          } else {
            "configured=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      # Signing has to run before Compress-Archive, or the zip carries the
      # unsigned executable.
      - name: Sign scrib_desktop.exe (Authenticode)
        if: steps.signing.outputs.configured == 'true'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGNING_ACCOUNT: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
        run: |
          dotnet tool install --global sign --prerelease
          sign code trusted-signing `
            --trusted-signing-account $env:SIGNING_ACCOUNT `
            --trusted-signing-certificate-profile $env:SIGNING_PROFILE `
            --trusted-signing-endpoint $env:SIGNING_ENDPOINT `
            "build/windows/x64/runner/Release/scrib_desktop.exe"

      - name: Package zip and checksum
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "scrib-desktop-$tag-windows-x64.zip"
          # GPLv3 section 4 requires the license text to be conveyed with the
          # work; the zip previously held only the build output.
          Copy-Item LICENSE "build/windows/x64/runner/Release/LICENSE.txt"
          Copy-Item README.md "build/windows/x64/runner/Release/README.md"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii -NoNewline
          Get-Content "$zip.sha256"

      # The .sha256 beside the zip only restates the zip: whoever can replace
      # one can replace the other. This attestation is a Sigstore-signed
      # statement held by GitHub, so it survives a substituted release asset.
      # Users verify with:
      #   gh attestation verify <zip> --repo beeswaxpat/scrib-desktop
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: scrib-desktop-*.zip

      - name: Upload package for the publish job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: |
            scrib-desktop-*.zip
            scrib-desktop-*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job holding write access, and it runs no build tooling: it
    # downloads the package the build job already produced and attested.
    permissions:
      contents: write

    steps:
      - name: Download package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: false
          generate_release_notes: true
          files: |
            scrib-desktop-*.zip
            scrib-desktop-*.zip.sha256
