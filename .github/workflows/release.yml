name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned for reproducible builds. A floating `stable` breaks the
          # Windows build whenever a new Flutter framework release adds abstract
          # members the pinned flutter_quill version doesn't yet implement. Bump
          # this in lockstep with the flutter_quill dependency.
          flutter-version: 3.38.6
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package zip and checksum
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "scrib-desktop-$tag-windows-x64.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii -NoNewline
          Get-Content "$zip.sha256"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: true
          files: |
            scrib-desktop-*.zip
            scrib-desktop-*.zip.sha256
