name: scrib_desktop
description: "The encrypted Notepad. No tracking. No cloud. Just notes."
publish_to: 'none'

version: 1.10.0+11

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Local storage - settings persistence
  hive: ^2.2.3

  # State management
  provider: ^6.1.2

  # File system
  path_provider: ^2.1.6
  file_picker: ^12.0.0

  # FFI â€” used for Windows atomic file replace (MoveFileExW)
  ffi: ^2.1.0

  # Encryption â€” AES-256-CBC, PBKDF2-SHA256, HMAC-SHA256
  pointycastle: ^4.0.0

  # Rich text editor. PINNED exactly: embed mechanics (custom block embeds,
  # unknownEmbedBuilder, the shortcut-collision workaround in editor_widget.dart)
  # are verified against this version and have changed between minor releases.
  # See ARCHITECTURE.md before bumping.
  flutter_quill: 11.5.0

  # Desktop-specific
  window_manager: ^0.5.2
  desktop_drop: ^0.7.1

  # Image embeds â€” flutter_svg renders SVG; image decodes the long-tail raster
  # formats (TIFF, TGA, ICO, PSD, etc.) and downscales large images on insert.
  flutter_svg: ^2.3.0
  image: ^4.8.0

  # Opens note links in the default browser (already transitive via
  # flutter_quill; declared because we import it directly).
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/scrib_icon.png
